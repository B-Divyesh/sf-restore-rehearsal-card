[package]
name = "restore-rehearsal-card"
description = "Run isolated restore drills and emit signed Markdown evidence"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license-file = "../LICENSE"
repository.workspace = true
readme = "../README.md"
keywords = ["backup", "restore", "docker", "disaster-recovery"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rrc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
